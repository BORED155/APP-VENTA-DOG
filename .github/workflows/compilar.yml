# Compila el APK de Android, la app de Mac y la de Windows. Necesita los secretos SUPABASE_URL y SUPABASE_KEY.
name: compilar
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  compilar:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cmd: flutter build apk --release --dart-define-from-file=config.json
            salida: build/app/outputs/flutter-apk/app-release.apk
          - os: macos-latest
            cmd: flutter build macos --release --dart-define-from-file=config.json && cd build/macos/Build/Products/Release && ditto -c -k --keepParent app_venta_dog.app APP-VENTA-DOG-mac.zip
            salida: build/macos/Build/Products/Release/APP-VENTA-DOG-mac.zip
          - os: windows-latest
            cmd: flutter build windows --release --dart-define-from-file=config.json && cd build/windows/x64/runner && mv Release APP-VENTA-DOG && 7z a APP-VENTA-DOG-windows.zip APP-VENTA-DOG
            salida: build/windows/x64/runner/APP-VENTA-DOG-windows.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash  # también en Windows (Git Bash), para que los mismos comandos sirvan en los tres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.os == 'ubuntu-latest'
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: config.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          jq -n '{SUPABASE_URL: env.SUPABASE_URL, SUPABASE_KEY: env.SUPABASE_KEY}' > config.json
      - run: flutter test
      - run: ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: ${{ matrix.salida }}

  # Al subir una etiqueta v*, publica el APK, el zip de Mac y el de Windows en Releases.
  publicar:
    needs: compilar
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - run: gh release create "$GITHUB_REF_NAME" app-release.apk APP-VENTA-DOG-mac.zip APP-VENTA-DOG-windows.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
